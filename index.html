<!doctype html>
<html lang="fa-IR" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Landing Page</title>
        <!-- CSS -->
        <link rel="stylesheet" href="./styles/main.css" />
    </head>
    <!-- Landing Page -->
    <body>
        <!-- Header Section  -->
        <header class="header">
            <img
                src="./assets/icons/hamburger-menu.svg"
                alt="hamburger-menu"
                class="header__hamburger-menu"
            />
            <a href="#" class="header__title">کوئرا لیست</a>
        </header>
        <!-- Hero Section -->
        <main class="hero">
            <div class="hero__content">
                <img
                    src="./assets/icons/star.svg"
                    alt="blue star"
                    class="hero__star hero__star--top"
                />
                <p class="hero__subtitle">تمرکز رو وارد زندگیت کن</p>
                <div class="hero__title-wrapper">
                    <h1 class="hero__title">به سمت اهدافت اوج بگیر</h1>
                    <img
                        src="./assets/icons/vector.svg"
                        alt="blue vector"
                        class="hero__vector"
                    />
                </div>
                <img
                    src="./assets/icons/star.svg"
                    alt="blue star"
                    class="hero__star hero__star--bottom"
                />
            </div>
            <p class="hero__description">
                "زمان در یک روز برای ما محدود است، اما مهمترین کار این است که
                چگونه از آن استفاده می‌کنیم. با اپلیکیشن کوئرا لیست، زمان خود را
                با هدف و برنامه‌ریزی موثر سپری کنید."
            </p>
            <div class="hero__actions">
                <a href="#" class="btn btn--primary">ورود به اپلیکیشن</a>
                <a href="#" class="btn btn--secondary">درباره ما</a>
            </div>
            <img
                src="./assets/icons/ellipse-right.svg"
                alt="blue circle"
                class="hero__circle hero__circle--right"
            />
            <img
                src="./assets/icons/ellipse-left.svg"
                alt="blue circle"
                class="hero__circle hero__circle--left"
            />
        </main>
    </body>
</html>
